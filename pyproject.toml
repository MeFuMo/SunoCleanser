[project]
name = "sunocleanser"
version = "0.2.0"
description = "Suno WAV adaptive spectral denoise (CLI + bilingual GUI)"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
suno-clean = "src.cli:main"
sunocleanser-gui = "src.gui.app:run_app"

[tool.pytest.ini_options]
testpaths = ["tests"]
